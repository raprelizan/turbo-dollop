<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Video Source Finder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Universal Video Finder</h1>
        <p>Works on any site (including program.mmgmena.com) for MP4 / M3U8 / Blob links.</p>
      </header>

      <button id="scanBtn" class="btn btn--primary">Scan for Videos</button>

      <section id="status" class="status" aria-live="polite"></section>
      <ul id="results" class="results"></ul>

      <footer class="note">
        M3U8: copy ready FFmpeg command.<br />
        Blob: request save from page context.
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
