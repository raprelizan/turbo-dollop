<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circle Video Finder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Circle Video Finder</h1>
        <p>Find MP4 / M3U8 / Blob sources from the current Circle page.</p>
      </header>

      <button id="scanBtn" class="btn btn--primary">Scan for Videos</button>

      <section id="status" class="status" aria-live="polite"></section>
      <ul id="results" class="results"></ul>

      <footer class="note">
        M3U8: we copy an FFmpeg command to convert to MP4.<br />
        Blob: we request download from inside the page context.
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
